<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>InterviewPrepX</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet">

        <!-- Bootstrap JS -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <link rel="stylesheet" href="style.css" />

        <style>
        body.offcanvas-open {
            padding-right: 0 !important;
            overflow: hidden;
        }

        .fix_backg {
            background-color: #AF7AD5;
        }

        /* DARK MODE */
        .dark-mode {
            background-color: black;
            color: white;
            transition: background-color 0.3s ease;
        }

        /* LIGHT MODE */
        .light-mode {
            background-color: white;
            color: black;
            transition: background-color 0.3s ease;
        }

        /* DARK MODE NAV LINKS */
        .dark-mode .nav-link {
            color: white !important;
        }

        /* LIGHT MODE NAV LINKS */
        .light-mode .nav-link {
            color: black !important;
        }

        .dark-mode .brand-text { color: white; }
        .light-mode .brand-text  { color: black; }

        .navbar {
            transition: background-color 0.3s ease;
        }


        .search-wrapper {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            background: #0d6efd;
            border-radius: 30px;
            overflow: hidden;
            width: 44px;
            height: 44px;
            transition: width 0.35s ease;
            flex-shrink: 0;
        }

        .search-wrapper.active {
            width: min(200px, 70vw);
        }
        

        .search-input {
            width: 0;
            opacity: 0;
            border: none;
            outline: none;
            background: transparent;
            color: #fff;
            height: 100%;
            padding: 0 12px;
            transition: 0.35s ease;
        }

        .search-wrapper.active .search-input {
            width: 100%;
            opacity: 1;
        }

        .search-icon {
            padding: 20px;
            width: 44px;
            height: 44px;
            background: none;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .offcanvas-end {
  width: 70vw;
  max-width: 300px;
}

        .navbar .container-fluid {
            flex-wrap: nowrap;
        }

        .navbar-toggler {
            flex-shrink: 0;
        }
        @media (min-width: 800px)  { 
            .search-wrapper.active {
                width: min(180px, 70vw);
        }
        }
    </style>
    </head>
    <body class="dark-mode">

        <nav class="navbar navbar-expand-lg dark-mode px-0">
            <div class="container-fluid">
                <!-- BRAND -->
                <a class="navbar-brand brand-text" href="#">InterPrepX</a>

                <!-- DESKTOP MENU -->
                <div class="collapse navbar-collapse d-none d-lg-flex">
                    <ul class="navbar-nav ms-auto me-3">
                        <li class="nav-item"><a class="nav-link text-white"
                                href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-white"
                                href="#">Profile</a></li>
                        <li class="nav-item"><a class="nav-link text-white"
                                href="#">Leaderboard</a></li>
                        <li class="nav-item"><a class="nav-link text-white"
                                href="#">Settings</a></li>
                    </ul>
                </div>

                <!-- RIGHT SIDE ICONS -->
                <div
                    class="d-flex align-items-center gap-2 nav-icons ms-auto flex-nowrap">
                    <div class="search-wrapper" id="searchWrapper">
                        <input type="text" class="search-input"
                            placeholder="Search..." />
                        <button class="search-icon" id="searchToggle"
                            type="button">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>

                    <button class="navbar-toggler fix_backg" type="button"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- OFFCANVAS MENU -->
        <div class="offcanvas offcanvas-end dark-mode" tabindex="-1"
            id="offcanvasMenu">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Menu</h5>
                <button type="button"
                    class="btn-close btn-close-white dark_mode"
                    data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body d-flex flex-column">
                <!-- MENU ITEMS -->
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link text-white"
                            href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white"
                            href="#">Profile</a></li>
                    <li class="nav-item"><a class="nav-link text-white"
                            href="#">Leaderboard</a></li>
                    <li class="nav-item"><a class="nav-link text-white"
                            href="#">Settings</a></li>
                </ul>

                <!-- THEME TOGGLE (BOTTOM) -->
                <div class="mt-auto pt-3 border-top">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox"
                            id="modeToggle">
                        <label class="form-check-label ms-2">Light Mode</label>
                    </div>
                </div>
            </div>
        </div>

        <div id="carouselExampleInterval" class="carousel slide"
            data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="10000">
                    <img src="download.png" class="d-block w-100 carousel-img"
                        alt="carousel image">
                </div>
                <div class="carousel-item" data-bs-interval="2000">
                    <img src="download.png" class="d-block w-100 carousel-img"
                        alt="carousel image">
                </div>
                <div class="carousel-item">
                    <img src="download.png" class="d-block w-100 carousel-img"
                        alt="carousel image">
                </div>
            </div>
            <button class="carousel-control-prev" type="button"
                data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"
                    aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button"
                data-bs-target="#carouselExampleInterval" data-bs-slide="next">
                <span class="carousel-control-next-icon"
                    aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <div class="container-fluid mb-2 w-100 fix_backg"
            style="border-bottom-left-radius: 10px; border-bottom-right-radius: 10px;">
            <h1>sfdgfgjl;k</h1>
            <p>aersdhjlj;k</p>
        </div>

        <section class="container-fluid .dark-mode">
            <div class="container-fluid text-center">
                <div class="row row-cols-md-2 row-cols-lg-3 row-cols-sm-2">
                    <div class="col my-2">
                        <div class="domain-card fix_backg"
                            onclick="openDomain('cs')">
                            <img
                                src="https://www.google.com/search?q=Computer+Science+Fundamentals+logo..."
                                alt="CS Fundamentals">
                            <h3>Computer Science Fundamentals</h3>
                        </div>
                    </div>

                    <div class="col my-2">
                        <div class="domain-card fix_backg"
                            onclick="openDomain('dsa')">
                            <img
                                src="https://www.google.com/search?client=ms-android-vivo-terr1-rso2..."
                                alt="DSA">
                            <h3>Data Structures & Algorithms</h3>
                        </div>
                    </div>

                    <div class="col my-2">
                        <div class="domain-card fix_backg"
                            onclick="openDomain('languages')">
                            <img
                                src="https://www.google.com/search?client=ms-android-vivo-terr1-rso2..."
                                alt="Programming">
                            <h3>Programming Languages</h3>
                        </div>
                    </div>

                    <div class="col my-2">
                        <div class="domain-card fix_backg"
                            onclick="openDomain('web')">
                            <img
                                src="https://www.google.com/search?q=Web+Development+logo..."
                                alt="Web Development">
                            <h3>Web Development</h3>
                        </div>
                    </div>

                    <div class="col my-2">
                        <div class="domain-card fix_backg"
                            onclick="openDomain('fullstack')">
                            <img
                                src="https://www.google.com/search?client=ms-android-vivo-terr1-rso2..."
                                alt="Full Stack">
                            <h3>Full Stack Development</h3>
                        </div>
                    </div>

                    <div class="col my-2">
                        <div class="domain-card fix_backg"
                            onclick="openDomain('fullstack')">
                            <img
                                src="https://www.google.com/search?q=Version+contorls+logo..."
                                alt="Full Stack">
                            <h3>Version contorls</h3>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- JS (CORRECT PLACE) -->
        <script>
        const searchWrapper = document.querySelector(".search-wrapper");
        const searchInput = document.querySelector(".search-input");
        const searchToggle = document.getElementById("searchToggle");

        searchToggle.addEventListener("click", () => {
            searchWrapper.classList.toggle("active");
            searchInput.focus();
        });

        const offcanvasEl = document.getElementById("offcanvasMenu");

        offcanvasEl.addEventListener("show.bs.offcanvas", () => {
            document.body.classList.add("offcanvas-open");
        });

        offcanvasEl.addEventListener("hidden.bs.offcanvas", () => {
            document.body.classList.remove("offcanvas-open");
        });

        offcanvasEl.addEventListener("show.bs.offcanvas", () => {
            document.body.classList.add("offcanvas-open");
            searchWrapper.classList.remove("active");
        });

        const toggle = document.getElementById("modeToggle");
        const body = document.body;
        const navbar = document.querySelector(".navbar");
        const offcanvas = document.getElementById("offcanvasMenu");

        toggle.addEventListener("change", () => {
            if (toggle.checked) {
                body.classList.replace("dark-mode", "light-mode");
                navbar.classList.replace("dark-mode", "light-mode");
                offcanvas.classList.replace("dark-mode", "light-mode");
            } else {
                body.classList.replace("light-mode", "dark-mode");
                navbar.classList.replace("light-mode", "dark-mode");
                offcanvas.classList.replace("light-mode", "dark-mode");
            }
        });
    </script>

    </body>
</html>
